name: Simulator-test-add-patient

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    env:
      APP_NAME: "orthoceph"
      XCODE_SCHEME: "orthoceph"
      XCODE_WORKSPACE: "ios/orthoceph.xcworkspace"
      SIMULATOR_NAME: "iPhone 15"

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies JS
        run: |
             rm -rf node_modules
             rm -rf ios/Pods ios/Podfile.lock
             rm -rf ~/Library/Developer/Xcode/DerivedData
             rm -rf build
             npm install --force

              
      - name: Install Pods
        working-directory: ios
        run: pod install --repo-update

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: List simulator yang tersedia
        run: xcrun simctl list devices available

      # ── Build khusus untuk simulator (tanpa code signing) ──
      - name: Build for Simulator
        run: |
          mkdir -p "$RUNNER_TEMP/build-sim"
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME" \
            -derivedDataPath "$RUNNER_TEMP/build-sim" \
            CODE_SIGNING_ALLOWED=NO

      - name: Cari path .app hasil build
        id: find_app
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/build-sim" -name "*.app" -path "*Release-iphonesimulator*" | head -n 1)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Ditemukan: $APP_PATH"

      - name: Nonaktifkan autocorrect & predictive keyboard
        run: |
          defaults write com.apple.Preferences KeyboardAutocorrection -bool NO
          defaults write com.apple.Preferences KeyboardPrediction -bool NO
          defaults write com.apple.Preferences KeyboardCapsLock -bool NO
          defaults write com.apple.Preferences KeyboardAutocapitalization -bool NO
          defaults write com.apple.Preferences KeyboardCheckSpelling -bool NO
   
      - name: Boot simulator
        run: |
          xcrun simctl boot "$SIMULATOR_NAME" || true
          xcrun simctl bootstatus "$SIMULATOR_NAME" -b


      - name: Install idb
        run: |
          brew tap facebook/fb
          brew trust facebook/fb
          brew install idb-companion
          pip3 install fb-idb --break-system-packages
          brew install idb-companion python@3.11

          /opt/homebrew/opt/python@3.11/bin/python3.11 -m venv $RUNNER_TEMP/idb-venv
          source $RUNNER_TEMP/idb-venv/bin/activate
          pip install fb-idb
          echo "$RUNNER_TEMP/idb-venv/bin" >> $GITHUB_PATH

          
          
      - name: Install app ke simulator
        run: |
          xcrun simctl install booted "${{ steps.find_app.outputs.app_path }}"

      # ── Ambil bundle id langsung dari Info.plist hasil build ──
      - name: Ambil Bundle Identifier
        id: bundle_id
        run: |
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "${{ steps.find_app.outputs.app_path }}/Info.plist")
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "Bundle ID: $BUNDLE_ID"

      # ── Mulai rekam log sistem simulator ke file, jalan di background ──
      - name: Mulai capture log simulator
        run: |
          xcrun simctl spawn booted log stream \
            --predicate "processImagePath CONTAINS \"${{ steps.find_app.outputs.app_path }}\" OR subsystem CONTAINS \"${{ steps.bundle_id.outputs.bundle_id }}\"" \
            > "$RUNNER_TEMP/simulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/log_pid"

      - name: Launch app & capture output langsung
        run: |
          xcrun simctl launch --console-pty booted "${{ steps.bundle_id.outputs.bundle_id }}" \
            > "$RUNNER_TEMP/simulator.log" 2>&1 &
          LAUNCH_PID=$!
          echo "$LAUNCH_PID" > "$RUNNER_TEMP/launch_pid"
          sleep 15
          echo "=== Log app (console-pty) ==="
          cat "$RUNNER_TEMP/simulator.log" || echo "Log kosong"

          
      - name: Cek exit code launch & tunggu app stabil
        run: |
          xcrun simctl launch booted "${{ steps.bundle_id.outputs.bundle_id }}"
          LAUNCH_EXIT=$?
          echo "Launch exit code: $LAUNCH_EXIT"
          sleep 3
          echo "=== Cek proses yang jalan di simulator ==="
          xcrun simctl spawn booted launchctl list | grep -i orthoceph || echo "App TIDAK ditemukan running"

      - name: Cek crash log kalau ada
        run: |
          echo "=== Mencari crash report ==="
          CRASH_DIR=~/Library/Logs/DiagnosticReports
          if [ -d "$CRASH_DIR" ]; then
            find "$CRASH_DIR" -iname "*orthoceph*" -mmin -10 -exec echo "--- {} ---" \; -exec cat {} \;
          else
            echo "Folder crash report tidak ditemukan"
          fi

          echo ""
          echo "=== Isi 100 baris terakhir simulator.log ==="
          tail -n 100 "$RUNNER_TEMP/simulator.log" || echo "simulator.log tidak ditemukan"
      #- name: Tunggu app render (beri waktu untuk load)
      # run: sleep 15

      - name: Ambil screenshot
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots"
          xcrun simctl io booted screenshot "$RUNNER_TEMP/screenshots/screenshot-01.png"

      - name: Hentikan capture log
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/log_pid")" || true

      - name: Upload screenshot sebagai artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: ${{ runner.temp }}/screenshots/*.png
          if-no-files-found: warn

      - name: Upload log simulator sebagai artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-log
          path: ${{ runner.temp }}/simulator.log
          if-no-files-found: warn  

      - name: Setup UDID sebagai env var
        run: |
            UDID=$(xcrun simctl list devices booted -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print([x['udid'] for v in d.values() for x in v if x.get('state')=='Booted'][0])")
            echo "Ditemukan UDID: $UDID"
            echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"



      - name: Start idb companion
        run: |
            idb_companion --udid "$SIM_UDID" &
            sleep 3
            idb list-targets

    
      # - name: Dismiss location permission dialog
      #   run: |
      #        idb ui tap 196 497 --udid "$SIM_UDID"
      #        sleep 2


 
      - name: Buat script Python
        run: |
          echo 'import json, os' > "$RUNNER_TEMP/check_elements.py"
          echo 'with open(os.environ["RUNNER_TEMP"] + "/describe.json") as f:' >> "$RUNNER_TEMP/check_elements.py"
          echo '    data = json.load(f)' >> "$RUNNER_TEMP/check_elements.py"
          echo 'for el in data:' >> "$RUNNER_TEMP/check_elements.py"
          echo '    role = el.get("role") or ""' >> "$RUNNER_TEMP/check_elements.py"
          echo '    label = el.get("AXLabel") or ""' >> "$RUNNER_TEMP/check_elements.py"
          echo '    frame = el.get("frame")' >> "$RUNNER_TEMP/check_elements.py"
          echo '    print(role, "|", repr(label), "|", frame)' >> "$RUNNER_TEMP/check_elements.py"


      - name: Cek dimensi screenshot
        run: |
          idb screenshot "$RUNNER_TEMP/test.png" --udid "$SIM_UDID"
          file "$RUNNER_TEMP/test.png"
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/test.png"
          
      - name: Ambil describe & jalankan script
        run: |
            idb ui describe-all --udid "$SIM_UDID" --json > "$RUNNER_TEMP/describe.json"
            python3 "$RUNNER_TEMP/check_elements.py"
          
      - name: Cek ukuran layar sebenarnya
        run: |
          idb describe --udid "$SIM_UDID"
                    
     
      - name: Test login flow
        run: |
            idb ui tap 196 498 --udid "$SIM_UDID"
            sleep 2
            idb ui tap 197 405 --udid "$SIM_UDID"
            sleep 3
        
            for attempt in 1 2 3 4 5; do
              # bersihkan field
              for i in $(seq 1 20); do
                idb ui key 42 --udid "$SIM_UDID"
              done
              sleep 1
              idb ui text "demo@demo.com" --udid "$SIM_UDID"
              sleep 2
        
              # cek isi field sekarang
              VALUE=$(idb ui describe-point 197 405 --udid "$SIM_UDID" --json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('AXValue') or '')" 2>/dev/null || echo "")
              echo "Percobaan $attempt, isi field: '$VALUE'"
        
              if [ "$VALUE" = "demo@demo.com" ]; then
                echo "Email berhasil terisi dengan benar!"
                break
              fi
            done

            sleep 2
        
            idb ui tap 197 462 --udid "$SIM_UDID"
            sleep 3
            idb ui text "admin" --udid "$SIM_UDID"
            sleep 2
            idb ui tap 31 579 --udid "$SIM_UDID"
            sleep 2
            # #Tap Registrasi
            # idb ui tap 160 636 --udid "$SIM_UDID"
            #Tap Login
            idb ui tap 196 515 --udid "$SIM_UDID"
            sleep 15
      
      - name: Screenshot hasil login
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots"
          idb screenshot "$RUNNER_TEMP/screenshots/after-login.png" --udid $SIM_UDID  

      - name: Upload screenshot login sebagai artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-screenshot
          path: ${{ runner.temp }}/screenshots/after-login.png
          if-no-files-found: warn

      - name: Ambil describe Form Registrasi
        run: |
            idb ui describe-all --udid "$SIM_UDID" --json > "$RUNNER_TEMP/describe.json"
            python3 "$RUNNER_TEMP/check_elements.py"

   

      - name: Tap add patient
        run: |
            idb ui tap 343 76 --udid "$SIM_UDID"
            sleep 10

      - name: Screenshot add patient
        run: |
           mkdir -p "$RUNNER_TEMP/screenshots"
           idb screenshot "$RUNNER_TEMP/screenshots/add-patient.png" --udid "$SIM_UDID"
           

      - name: Ambil describe form input patient
        run: |
            idb ui describe-all --udid "$SIM_UDID" --json > "$RUNNER_TEMP/describe.json"
            python3 "$RUNNER_TEMP/check_elements.py"

            

      - name: Buat script Python untuk isi field secara reliable
        run: |
          cat > "$RUNNER_TEMP/type_reliably.py" << 'PYEOF'
          import json, subprocess, sys, time
      
          UDID = sys.argv[1]
          X = float(sys.argv[2])
          Y = float(sys.argv[3])
          TARGET = sys.argv[4]
          LABEL_HINT = sys.argv[5]
          IS_SECURE = (len(sys.argv) > 6 and sys.argv[6] == "secure")
      
          CHUNK_SIZE = 3
          MAX_ROUNDS = 15
          ANCHOR = "0"
          EPS = 2.0  # toleransi pembulatan frame (point)
      
          def describe():
              out = subprocess.run(
                  ["idb", "ui", "describe-all", "--udid", UDID, "--json"],
                  capture_output=True, text=True
              ).stdout
              return json.loads(out)
      
          def find_field(elements):
              role_candidates = ("AXTextField", "AXSecureTextField", "AXTextArea")
              best, best_dist = None, None
              for el in elements:
                  role = el.get("role") or el.get("AXRole") or ""
                  if role not in role_candidates:
                      continue
                  frame = el.get("frame") or {}
                  fx = frame.get("x", 0)
                  fy = frame.get("y", 0)
                  fw = frame.get("width", 0)
                  fh = frame.get("height", 0)
                  # cocokkan dengan toleransi, bukan perbandingan ketat
                  if (fx - EPS) <= X <= (fx + fw + EPS) and (fy - EPS) <= Y <= (fy + fh + EPS):
                      return el
                  # simpan kandidat terdekat sebagai fallback
                  cx = fx + fw / 2
                  cy = fy + fh / 2
                  dist = (cx - X) ** 2 + (cy - Y) ** 2
                  if best_dist is None or dist < best_dist:
                      best, best_dist = el, dist
              return best
      
          def field_center(field):
              frame = field.get("frame") or {}
              cx = frame.get("x", 0) + frame.get("width", 0) / 2
              cy = frame.get("y", 0) + frame.get("height", 0) / 2
              return cx, cy
      
          def current_value():
              field = find_field(describe())
              return (field.get("AXValue") or "") if field else ""
      
          def is_effectively_empty(val):
              # placeholder kadang muncul sebagai AXValue saat field kosong
              return val == "" or val.strip().lower() == LABEL_HINT.strip().lower()
      
          def tap(x, y):
              subprocess.run(["idb", "ui", "tap", str(x), str(y), "--udid", UDID])
              time.sleep(0.8)
      
          def key(code, times=1):
              for _ in range(times):
                  subprocess.run(["idb", "ui", "key", str(code), "--udid", UDID])
      
          def text(s):
              subprocess.run(["idb", "ui", "text", s, "--udid", UDID])
      
          def clear_field():
              tap(X, Y)
              time.sleep(0.3)
              val = current_value()
              if not is_effectively_empty(val):
                  key(42, times=len(val) + 10)
              time.sleep(0.5)
      
          def is_progressing(expected_full, current):
              if IS_SECURE:
                  return len(current) <= len(expected_full) and all(c == "\u2022" for c in current)
              if is_effectively_empty(current):
                  return True
              return expected_full.startswith(current)
      
          def is_complete(expected_full, current):
              if IS_SECURE:
                  return len(current) == len(expected_full)
              return current == expected_full
      
          # === mulai ===
          field = find_field(describe())
          if field:
              tx, ty = field_center(field)
              print(f"Field ditemukan, tap ke tengah frame: ({tx}, {ty})")
          else:
              tx, ty = X, Y
              print(f"Field tidak ditemukan lewat describe, pakai koordinat argumen: ({tx}, {ty})")
      
          tap(tx, ty)
          time.sleep(0.5)
          clear_field()
      
          full_with_anchor = ANCHOR + TARGET
          typed_len = 0
          rounds = 0
      
          while typed_len < len(full_with_anchor) and rounds < MAX_ROUNDS:
              rounds += 1
              remaining = full_with_anchor[typed_len:]
              chunk = remaining[:CHUNK_SIZE]
              text(chunk)
              time.sleep(0.5)
              current_val = current_value()
      
              if IS_SECURE:
                  print(f"Round {rounds}: target_len={len(full_with_anchor)} now_len={len(current_val)}")
                  if is_progressing(full_with_anchor, current_val):
                      typed_len = len(current_val)
                  else:
                      print("Panjang tidak sesuai, clear ulang...")
                      clear_field()
                      typed_len = 0
              else:
                  print(f"Round {rounds}: expect(anchor+target)='{full_with_anchor}' now='{current_val}'")
                  if is_effectively_empty(current_val):
                      # field masih dianggap kosong (baru placeholder), belum ada progres
                      print("Field masih kosong/placeholder, coba lagi tanpa clear...")
                      typed_len = 0
                  elif full_with_anchor.startswith(current_val):
                      typed_len = len(current_val)
                  else:
                      print("Karakter salah terdeteksi, clear ulang...")
                      clear_field()
                      typed_len = 0
      
          reached_full = (typed_len == len(full_with_anchor))
      
          if not reached_full:
              print(f"GAGAL mengetik teks lengkap setelah {MAX_ROUNDS} percobaan")
              sys.exit(1)
      
          print("Teks lengkap (dengan anchor) berhasil masuk. Menghapus anchor...")
          key(80, times=len(full_with_anchor) + 3)
          time.sleep(0.3)
          key(76, times=1)
          time.sleep(0.5)
      
          final_val = current_value()
          final_len = len(final_val)
          expected_len = len(TARGET)
      
          if IS_SECURE:
              print(f"Panjang akhir: {final_len}, diharapkan: {expected_len}")
              if final_len == expected_len:
                  print("BERHASIL - panjang password sesuai (isi tidak bisa diverifikasi karena secure field)")
                  sys.exit(0)
              else:
                  print("GAGAL - panjang password tidak sesuai")
                  sys.exit(1)
          else:
              print(f"Hasil akhir: '{final_val}'")
              if final_val == TARGET:
                  print("BERHASIL")
                  sys.exit(0)
              else:
                  print("GAGAL")
                  sys.exit(1)
          PYEOF
          echo "Script type_reliably.py berhasil dibuat"

      - name: Isi Full Name
        run: | 
            idb ui tap 196 285 --udid "$SIM_UDID"
            sleep 3
            idb ui text "pasiennya" --udid "$SIM_UDID"
            sleep 2 

      - name: Isi Gender
        run: | 
            idb ui tap 196 334 --udid "$SIM_UDID"
            sleep 10
            idb ui tap 196 344 --udid "$SIM_UDID"
            sleep 10

      - name: Isi Race
        run: | 
            idb ui tap 196 383 --udid "$SIM_UDID"
            sleep 10
            idb ui tap 196 394 --udid "$SIM_UDID"
            sleep 10
        # python3 "$RUNNER_TEMP/type_reliably.py" "$SIM_UDID" 196 285 "Pasien Budi" "Full Name"

      - name: Isi Age
        run: |
            idb ui tap 196 431 --udid "$SIM_UDID"
            sleep 3
            idb ui text "30" --udid "$SIM_UDID"
            sleep 2 
        # python3 "$RUNNER_TEMP/type_reliably.py" "$SIM_UDID" 196 431 "40" "Age"
      
      - name: Tap save patient
        run: |
            idb ui tap 196 480 --udid "$SIM_UDID"
            sleep 10

      - name: Screenshot hasil add patient
        run: |
           mkdir -p "$RUNNER_TEMP/screenshots"
           idb screenshot "$RUNNER_TEMP/screenshots/hasil-add-patient.png" --udid "$SIM_UDID"

      # - name: Isi Email
      #   run: python3 "$RUNNER_TEMP/type_reliably.py" "$SIM_UDID" 196 408 "budi.sudarsono@example.com" "Email"

      # - name: Isi Password
      #   run: python3 "$RUNNER_TEMP/type_reliably.py" "$SIM_UDID" 196 483 "admin" "Password" secure

      # - name: Screenshot form sebelum submit
      #   run: |
      #     mkdir -p "$RUNNER_TEMP/screenshots"
      #     idb screenshot "$RUNNER_TEMP/screenshots/before-register-submit.png" --udid "$SIM_UDID"

      # - name: Tap tombol Register
      #   run: |
      #     idb ui tap 196 539 --udid "$SIM_UDID"
      #     sleep 5

      # - name: Screenshot hasil registrasi
      #   run: |
      #     mkdir -p "$RUNNER_TEMP/screenshots"
      #     idb screenshot "$RUNNER_TEMP/screenshots/after-register.png" --udid "$SIM_UDID"

      
      - name: Upload screenshot add patient sebagai artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: add-patient-screenshots
          path: ${{ runner.temp }}/screenshots/*.png
          if-no-files-found: warn

   
